name: Security

on:
  pull_request:
    branches: [main]
  # No branch filter: the secret scan must see every branch push, not only the
  # default branch, or a credential committed to a task branch reaches main
  # through a merge without any lane ever having looked at the branch.
  push:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Install npm 12.0.2
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "12.0.2"
      - name: Audit dependencies
        # The recorded baseline is known-red, so this step reports and the
        # comparison below decides. A bare audit returns the same answer for
        # the recorded baseline and for a new high-severity dependency.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Compare the audit against the recorded baseline
        run: node scripts/audit-baseline.mjs
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The report artifact is what makes a "zero leaks" claim
          # re-inspectable instead of a sentence in a plan file.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
