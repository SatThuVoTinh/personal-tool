server {
    listen 8080;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /knowledge/ {
        # Docker's embedded DNS is only needed while proxying. Keeping the
        # upstream in a variable lets the M2 health endpoint remain available
        # before the optional M3 service has been started.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $knowledge_upstream knowledge:8000;
        rewrite ^/knowledge/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_pass http://$knowledge_upstream;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # F-288 (R7-C4-01): the DEPLOYED stack now serves the same model
    # allowlist the acceptance overlay proves, so the isolation evidence
    # covers the shape that actually ships. Only the two APIs Knowledge uses
    # are reachable; model-pull and request-controlled forwarding endpoints
    # are not, and the catch-all route below still refuses everything else.
    location = /ollama/api/tags {
        limit_except GET {
            deny all;
        }
        proxy_http_version 1.1;
        proxy_pass http://host.docker.internal:11434/api/tags;
    }

    location = /ollama/api/embed {
        limit_except POST {
            deny all;
        }
        proxy_http_version 1.1;
        proxy_pass http://host.docker.internal:11434/api/embed;
    }

    location / {
        return 404;
    }
}
