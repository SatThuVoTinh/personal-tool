server {
    listen 8080;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /knowledge/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $knowledge_upstream knowledge:8000;
        rewrite ^/knowledge/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_pass http://$knowledge_upstream;
    }

    # Acceptance-only allowlist. Only the two APIs used by Knowledge are
    # reachable; model-pull and request-controlled forwarding endpoints are not.
    location = /ollama/api/tags {
        limit_except GET {
            deny all;
        }
        proxy_http_version 1.1;
        proxy_pass http://host.docker.internal:11434/api/tags;
    }

    location = /ollama/api/embed {
        limit_except POST {
            deny all;
        }
        proxy_http_version 1.1;
        proxy_pass http://host.docker.internal:11434/api/embed;
    }

    location / {
        return 404;
    }
}
