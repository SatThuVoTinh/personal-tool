services:
  object-storage:
    labels:
      com.personal-tool.persistence: operational

  postgres:
    labels:
      com.personal-tool.persistence: operational

  redis:
    labels:
      com.personal-tool.persistence: operational

  nginx:
    labels:
      com.personal-tool.persistence: operational

  knowledge:
    volumes:
      - type: bind
        source: ${KNOWLEDGE_VAULT_ROOT:?KNOWLEDGE_VAULT_ROOT is required for the knowledge profile}
        target: /vault
        read_only: true
    labels:
      com.personal-tool.persistence: operational

networks:
  platform:
    labels:
      com.personal-tool.persistence: operational

volumes:
  object-storage-data:
    labels:
      com.personal-tool.persistence: operational
  postgres-data:
    labels:
      com.personal-tool.persistence: operational
