x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime-defaults
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unconfigured}
      POSTGRES_USER: postgres
      # F-INFRA-002 (owner option C, 2026-11-01): the image init phase runs
      # bootstrap-postgres-init.sh from /docker-entrypoint-initdb.d on the
      # first boot of an empty volume, so it needs the same fail-closed module
      # passwords the one-shot postgres-bootstrap helper already carries. The
      # superuser can already reset these roles, so the effective module
      # boundary is unchanged. start.ps1 validates them before its first `up`.
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-unconfigured}
      N8N_POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-unconfigured}
      SKILL_DB_PASSWORD: ${SKILL_DB_PASSWORD:-unconfigured}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # F-INFRA-002 (owner option C, 2026-11-01): provision the module roles
      # while the image initializes an empty data volume. The wrapper is what
      # initdb.d runs; the bootstrap stays the single role authority and the
      # postgres-bootstrap service still re-runs it on every start, so
      # existing volumes converge without a re-init.
      - type: bind
        source: ../scripts/bootstrap-postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-bootstrap-postgres.sh
        read_only: true
      - type: bind
        source: ../scripts/bootstrap-postgres.sh
        target: /usr/local/bin/bootstrap-postgres.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1536m
    shm_size: 256m
    stop_grace_period: 1m
    labels:
      personal-tool.component: postgresql
      personal-tool.project: personal-tool
    networks:
      - platform

  postgres-bootstrap:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    profiles: ["bootstrap"]
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-postgres.sh"]
    command: []
    environment:
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-unconfigured}
      N8N_POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-unconfigured}
      SKILL_DB_PASSWORD: ${SKILL_DB_PASSWORD:-unconfigured}
      PGCONNECT_TIMEOUT: "5"
      PGDATABASE: postgres
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-unconfigured}
      PGUSER: postgres
    volumes:
      - type: bind
        source: ../scripts/bootstrap-postgres.sh
        target: /usr/local/bin/bootstrap-postgres.sh
        read_only: true
    mem_limit: 128m
    labels:
      personal-tool.component: postgresql-bootstrap
      personal-tool.project: personal-tool
    networks:
      - platform

  n8n:
    <<: *runtime-defaults
    image: n8nio/n8n:2.33.0@sha256:fd12b6c519101fa99b9efe731e3e7e06249e918a8df628e7e778123811b8c265
    profiles: ["automation", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-unconfigured}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_POOL_SIZE: "2"
      DB_POSTGRESDB_USER: n8n
      DB_TYPE: postgresdb
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_MAX_DISPLAY_SIZE: "33554432"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-unconfigured}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PROTOCOL: http
      N8N_USER_FOLDER: /home/node
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5678/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 768m
    stop_grace_period: 1m
    labels:
      personal-tool.component: automation-platform
      personal-tool.project: personal-tool
    networks:
      - platform

  nginx:
    <<: *runtime-defaults
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    profiles: ["knowledge", "all"]
    ports:
      - "127.0.0.1:8080:8080"
    # F-288 (R7-C4-01): the deployed gateway proxies the model service on
    # the host, so it needs the same host-gateway mapping the acceptance
    # overlay gives it.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ../../nginx/conf.d/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 128m
    labels:
      personal-tool.component: reverse-proxy
      personal-tool.project: personal-tool
    networks:
      - platform

  knowledge:
    <<: *runtime-defaults
    build:
      context: ../../../apps/knowledge
      dockerfile: Dockerfile
      args:
        KNOWLEDGE_IMAGE_REVISION: ${KNOWLEDGE_IMAGE_REVISION:-unverified}
    image: personal-tool/knowledge:m3
    profiles: ["knowledge", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KNOWLEDGE_DATABASE_HOST: postgres
      KNOWLEDGE_DATABASE_NAME: postgres
      KNOWLEDGE_DATABASE_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-unconfigured}
      KNOWLEDGE_DATABASE_PORT: "5432"
      KNOWLEDGE_DATABASE_USER: knowledge_app
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "1024"
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-bge-m3:latest}
      KNOWLEDGE_INDEX_ADVISORY_LOCK_KEY: "741212391041002"
      # F-288 (R7-C4-01): the model calls go through the allowlisted
      # gateway, so the deployed stack carries the same egress boundary the
      # acceptance overlay proves.
      KNOWLEDGE_OLLAMA_URL: http://nginx:8080/ollama
      KNOWLEDGE_RERANKER_MANIFEST_PATH: /app/artifacts/reranker-manifest.json
      KNOWLEDGE_RERANKER_MODEL_PATH: /app/artifacts/model.int8.onnx
      KNOWLEDGE_VAULT_ROOT: /vault
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s
    mem_limit: 4g
    labels:
      personal-tool.component: knowledge-platform
      personal-tool.project: personal-tool
    networks:
      - platform

  dozzle:
    <<: *runtime-defaults
    image: amir20/dozzle:v10.7.1@sha256:a8441e9d2928cc7b30d0023f5eedbb87ef6e234d87f3be02662bd8f417955b8b
    profiles: ["knowledge", "automation", "all"]
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_FILTER: label=personal-tool.project=personal-tool
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 128m
    labels:
      personal-tool.component: log-viewer
      personal-tool.project: personal-tool
    networks:
      - platform

networks:
  # The shared platform network, declared in
  # infrastructure/networking/networks.yml and consumed here by that shared
  # name. The Docker network is project scoped (<project>_platform), so the
  # acceptance stacks stay isolated from the live stack.
  # F-INFRA-001 (R9-I05-01): the platform network is internal to enforce egress
  # through the Nginx model gateway; containers cannot bypass the allowlist by
  # reaching host.docker.internal or other external hosts.
  platform:
    driver: bridge
    internal: true

volumes:
  n8n-data:
  postgres-data:
