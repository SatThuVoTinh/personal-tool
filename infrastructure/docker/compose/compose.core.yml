x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  object-storage:
    <<: *runtime-defaults
    image: quay.io/minio/aistor/minio:RELEASE.2026-08-07T18-34-35Z@sha256:d1eb0f79ced75d6c024fc6a2ab6a7b3629ff54c798d967d9c6f89951237480a7
    command:
      - server
      - /data
      - --console-address
      - ":9001"
      - --license
      - /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
      - type: bind
        source: ${AISTOR_LICENSE_FILE}
        target: /minio.license
        read_only: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1280m
    stop_grace_period: 1m
    labels:
      personal-tool.component: object-storage
      personal-tool.milestone: m2-t1
      personal-tool.project: personal-tool
    networks:
      - platform

  aistor-mc:
    image: quay.io/minio/aistor/mc:RELEASE.2026-07-24T01-15-12Z@sha256:7d6de07bfa6daf7f9c9c459fc0f91cc86dee3e89849b807b6ef1b66e9b7991a0
    profiles:
      - tools
    entrypoint:
      - /bin/sh
      - /usr/local/bin/aistor-mc-entrypoint.sh
    environment:
      AISTOR_ENDPOINT: http://object-storage:9000
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ../scripts/aistor-mc-entrypoint.sh
        target: /usr/local/bin/aistor-mc-entrypoint.sh
        read_only: true
    mem_limit: 256m
    labels:
      personal-tool.component: object-storage-client
      personal-tool.milestone: m2-t1
      personal-tool.project: personal-tool
    networks:
      - platform

  postgres:
    <<: *runtime-defaults
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m2-t2-unconfigured}
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 2g
    shm_size: 256m
    stop_grace_period: 1m
    labels:
      personal-tool.component: postgresql
      personal-tool.milestone: m2-t2
      personal-tool.project: personal-tool
    networks:
      - platform

  postgres-bootstrap:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    profiles:
      - tools
    entrypoint:
      - /bin/sh
      - /usr/local/bin/bootstrap-postgres.sh
    command: []
    environment:
      N8N_POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-m2-t2-unconfigured}
      PGCONNECT_TIMEOUT: "5"
      PGDATABASE: postgres
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-m2-t2-unconfigured}
      PGUSER: postgres
    volumes:
      - type: bind
        source: ../scripts/bootstrap-postgres.sh
        target: /usr/local/bin/bootstrap-postgres.sh
        read_only: true
    mem_limit: 256m
    labels:
      personal-tool.component: postgresql-bootstrap
      personal-tool.milestone: m2-t2
      personal-tool.project: personal-tool
    networks:
      - platform

  redis:
    <<: *runtime-defaults
    image: redis:8.4.0@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - type: bind
        source: ../../databases/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 512m
    labels:
      personal-tool.component: redis
      personal-tool.milestone: m2-t2
      personal-tool.project: personal-tool
    networks:
      - platform

  n8n:
    <<: *runtime-defaults
    image: n8nio/n8n:2.33.0@sha256:fd12b6c519101fa99b9efe731e3e7e06249e918a8df628e7e778123811b8c265
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-m2-t2-unconfigured}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_POOL_SIZE: "2"
      DB_POSTGRESDB_USER: n8n
      DB_TYPE: postgresdb
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_MAX_DISPLAY_SIZE: "33554432"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-m2-t3-unconfigured}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PROTOCOL: http
      # n8n appends .n8n to this base directory. Keep that resulting
      # directory aligned with the named volume mount below.
      N8N_USER_FOLDER: /home/node
      OLLAMA_SMOKE_MODEL: ${OLLAMA_SMOKE_MODEL}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5678/healthz'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1280m
    stop_grace_period: 1m
    labels:
      personal-tool.component: automation-platform
      personal-tool.milestone: m2-t3
      personal-tool.project: personal-tool
    networks:
      - platform

  nginx:
    <<: *runtime-defaults
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ../../nginx/conf.d/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    labels:
      personal-tool.component: reverse-proxy
      personal-tool.milestone: m2-t3
      personal-tool.project: personal-tool
    networks:
      - platform

  knowledge:
    <<: *runtime-defaults
    build:
      context: ../../../apps/knowledge
      dockerfile: Dockerfile
    image: personal-tool/knowledge:m3-t2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KNOWLEDGE_DATABASE_HOST: postgres
      KNOWLEDGE_DATABASE_NAME: postgres
      KNOWLEDGE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-m2-t2-unconfigured}
      KNOWLEDGE_DATABASE_PORT: "5432"
      KNOWLEDGE_DATABASE_USER: postgres
      KNOWLEDGE_EMBEDDING_DIMENSIONS: "1024"
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-bge-m3:latest}
      KNOWLEDGE_INDEX_ADVISORY_LOCK_KEY: "741212391041002"
      KNOWLEDGE_OLLAMA_URL: http://host.docker.internal:11434
      KNOWLEDGE_VAULT_ROOT: /vault
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 768m
    labels:
      personal-tool.component: knowledge-platform
      personal-tool.milestone: m3-t2
      personal-tool.project: personal-tool
    networks:
      - platform

  postgres-exporter:
    <<: *runtime-defaults
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-m2-t2-unconfigured}
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 128m
    labels:
      personal-tool.component: postgresql-exporter
      personal-tool.milestone: m2-t4
      personal-tool.project: personal-tool
    networks:
      - platform

  redis-exporter:
    <<: *runtime-defaults
    image: oliver006/redis_exporter:v1.89.0@sha256:fed773ffd2bb2eac706e0ed9cc2fff41651193ee4977e2a4f6919658ad2313f4
    depends_on:
      redis:
        condition: service_healthy
    command:
      - --redis.addr=redis://redis:6379
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 64m
    labels:
      personal-tool.component: redis-exporter
      personal-tool.milestone: m2-t4
      personal-tool.project: personal-tool
    networks:
      - platform

  prometheus:
    <<: *runtime-defaults
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    depends_on:
      postgres-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ../../observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 1g
    labels:
      personal-tool.component: metrics-collector
      personal-tool.milestone: m2-t4
      personal-tool.project: personal-tool
    networks:
      - platform

  grafana:
    <<: *runtime-defaults
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ../../observability/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ../../observability/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ../../observability/grafana/dashboards
        target: /etc/grafana/provisioning/dashboards-json
        read_only: true
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g
    labels:
      personal-tool.component: metrics-dashboard
      personal-tool.milestone: m2-t4
      personal-tool.project: personal-tool
    networks:
      - platform

  dozzle:
    <<: *runtime-defaults
    image: amir20/dozzle:v10.7.1@sha256:a8441e9d2928cc7b30d0023f5eedbb87ef6e234d87f3be02662bd8f417955b8b
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_FILTER: label=personal-tool.project=personal-tool
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    labels:
      personal-tool.component: log-viewer
      personal-tool.milestone: m2-t4
      personal-tool.project: personal-tool
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  object-storage-data:
  n8n-data:
  postgres-data:
