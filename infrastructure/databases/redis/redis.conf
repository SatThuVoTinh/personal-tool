# M2/T2: Redis is transient auxiliary storage, not a source of truth.
# The service has no host port and no data volume; container recreation discards keys.
bind 0.0.0.0
port 6379
protected-mode no
save ""
appendonly no
# Keep the transient dataset below the container ceiling so Redis can evict
# cache entries instead of being terminated by Docker at the hard limit.
maxmemory 192mb
maxmemory-policy allkeys-lru
maxmemory-clients 5%
loglevel notice
