[project]
name = "personal-tool-knowledge"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.133.0",
  "httpx==0.28.1",
  "onnxruntime==1.27.0",
  "pyyaml==6.0.3",
  "tokenizers==0.23.1",
  "uvicorn[standard]==0.34.0",
]

# Test-only dependencies. The runtime image installs `--no-dev`, so this group
# never reaches the deployed service closure; it exists so the Knowledgebase
# Python suite is part of the repository quality gate.
[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = false

# F-212 (R5-E09-04): the Knowledgebase lane reported a bare pass count, so a
# SHRINKING collected set read as an unchanged green and an unreported skip
# was invisible. `-rs` surfaces every skip reason in the summary and
# `--strict-markers` turns an unregistered marker into an error instead of a
# silent pass. The collected-count floor lives in `tests/conftest.py`, which
# is the only place that can see the collected set.
[tool.pytest.ini_options]
addopts = "-rs --strict-markers"
